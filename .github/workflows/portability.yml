name: Verify portability installers

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  debian-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest coverage
        run: python3 scripts/verify-portability-manifests.py
      - name: Parse shell scripts
        run: |
          bash -n install-debian.sh
          bash -n utils/remme-linux.sh
          bash -n utils/git-show-lfs.sh
      - name: Render Debian plan
        run: bash install-debian.sh --plan >/dev/null

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer and helpers
        shell: pwsh
        run: |
          $files = @(
            'install-windows.ps1',
            'utils/remme.ps1',
            'utils/mkv2mp4.ps1',
            'utils/git-show-lfs.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "PowerShell parser errors in $file"
            }
          }
      - name: Validate manifest coverage and render Windows plan
        shell: pwsh
        run: |
          python scripts/verify-portability-manifests.py
          .\install-windows.ps1 -Plan *> $null
